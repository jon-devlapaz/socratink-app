<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7ece1">
  <meta name="application-name" content="socratink">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="socratink">
  <title>socratink — sign in</title>
  <link rel="manifest" href="/manifest.webmanifest?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=6">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=6">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6">
  <link rel="stylesheet" href="/css/tokens.css?v=3">
  <!-- socratink-login-css -->
  <script>
    try {
      if (localStorage.getItem('socratink.motion') === 'reduced') {
        document.documentElement.dataset.motion = 'reduced';
      }
    } catch (err) { /* localStorage unavailable; fall through */ }
  </script>
</head>
<body data-mode="signin" data-login-template="public">
  <div id="stardust-container" aria-hidden="true"></div>
  <div class="aurora aurora-a" data-parallax="0.05"></div>
  <div class="aurora aurora-b" data-parallax="0.03"></div>
  <div class="aurora aurora-c" data-parallax="0.08"></div>

  <main class="login-shell">
    <div class="login-stage">
      <div class="brand-lockup">
        <p class="brand-title">socra<span class="brand-title-accent">tink</span></p>
      </div>

      <section class="login-card" aria-labelledby="login-heading">
        <div class="login-card-inner">
          <div id="auth-status-banner" class="auth-status-banner" role="status" aria-live="polite" aria-atomic="true" hidden></div>

          <div class="login-introduction">
            <h1 id="login-heading">Close the source. Explain it. See what survives.</h1>
          </div>

          <div class="social-stack">
            <a id="guest-continue-link" class="guest-button" href="/">
              Start without an account
            </a>
            <div class="login-divider" aria-hidden="true"><span>or</span></div>
            <a id="google-login-link" class="google-button" href="/auth/google">
              <svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
              </svg>
              <span id="google-label">Start with a Google account</span>
            </a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- socratink-login-js -->
</body>
</html>
