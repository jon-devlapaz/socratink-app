name: preflight

# CI gates: type-check + unit/integration tests, plus strict diff coverage.
#
# Complements (does not replace) the local pre-deploy gate at
# scripts/preflight-deploy.sh, which also runs `vercel build` against
# real Vercel credentials. That gate stays local-only because it needs
# secrets and the full deploy toolchain.
#
# The coverage job starts a loopback uvicorn server and runs
# scripts/check-coverage.sh, which includes the browser/V8 coverage path.

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_ENABLED: 'true'
      SUPABASE_URL: 'https://example.supabase.co'
      SUPABASE_PUBLISHABLE_KEY: 'dummy-publishable-key'
      SUPABASE_JWT_SECRET: 'dummy-jwt-secret'
      APP_BASE_URL: 'http://localhost:8000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Generate per-run Fernet key
        # Throwaway key scoped to this CI run; production sets SESSION_COOKIE_KEY
        # via Vercel env. Echoed to $GITHUB_ENV so subsequent steps see it.
        # Uses stdlib only — Fernet.generate_key() is just 32 random bytes,
        # urlsafe-b64 encoded — so this runs before bootstrap installs deps.
        run: |
          echo "SESSION_COOKIE_KEY=$(python -c 'import os, base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> $GITHUB_ENV

      - name: Bootstrap repo Python + hooks
        run: |
          bash scripts/bootstrap-python.sh

      - name: Doctor
        run: |
          bash scripts/doctor.sh

      - name: Pytest
        env:
          GEMINI_API_KEY: dummy-for-tests
        run: .venv/bin/pytest -q --ignore=tests/e2e

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_ENABLED: 'true'
      SUPABASE_URL: 'https://example.supabase.co'
      SUPABASE_PUBLISHABLE_KEY: 'dummy-publishable-key'
      SUPABASE_JWT_SECRET: 'dummy-jwt-secret'
      APP_BASE_URL: 'http://localhost:8000'
      GEMINI_API_KEY: dummy-for-tests
      SOCRATINK_BASE_URL: 'http://localhost:8000'
      SOCRATINK_E2E_LOCAL_GUEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select coverage compare ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            compare_ref="origin/$PR_BASE_REF"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            compare_ref="$PUSH_BEFORE"
          else
            echo "Unable to determine coverage compare ref for $EVENT_NAME" >&2
            exit 1
          fi
          echo "COMPARE_BRANCH=$compare_ref" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Generate per-run Fernet key
        run: |
          echo "SESSION_COOKIE_KEY=$(python -c 'import os, base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> $GITHUB_ENV

      - name: Bootstrap repo Python + hooks
        run: |
          bash scripts/bootstrap-python.sh

      - name: Install frontend coverage tooling
        run: |
          npm ci

      - name: Install Chromium
        run: |
          .venv/bin/playwright install chromium

      - name: Start local app
        run: |
          .venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000 &
          echo "$!" > uvicorn.pid
          .venv/bin/python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 30
          last_error = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          raise SystemExit(f"local app did not become healthy: {last_error}")
          PY

      - name: Diff coverage
        run: |
          bash scripts/check-coverage.sh

      - name: Stop local app
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" 2>/dev/null || true
          fi
